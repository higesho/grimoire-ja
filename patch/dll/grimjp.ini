[font]
face=MS Gothic
size_adjust=0
small_max_cell=9
fallback_max_cell=6
; widget (decorative label) text colour: palette index in 8-bit mode, RGB otherwise
widget_color_index=49
widget_color=C8A0FF
[debug]
enable_log=1
log=0
; 1 = record every drawn ASCII-only string to grimjp/collected_ascii.txt
collect_ascii=0
